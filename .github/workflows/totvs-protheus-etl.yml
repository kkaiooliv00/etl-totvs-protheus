name: ETL TOTVS Protheus

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Dias para atualizar os jobs com filtro de data. Use 0 para carga total.
        required: true
        type: string
        default: "0"
      request_id:
        description: ID da API para executar apenas uma tabela. Use 0 para rodar todas.
        required: true
        type: string
        default: "0"
  schedule:
    # GitHub cron uses UTC. Runs at 13:00 America/Fortaleza with 30 days of history.
    - cron: "0 16 * * *"
    # Runs daily at 02:00 America/Fortaleza with 60 days of history.
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: etl-totvs-protheus
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run ETL
        env:
          API_PROTHEUS_PASSWORD: ${{ secrets.API_PROTHEUS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LOOKBACK_DAYS="${{ inputs.lookback_days }}"
            REQUEST_ID="${{ inputs.request_id }}"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            LOOKBACK_DAYS="60"
            REQUEST_ID="0"
          else
            LOOKBACK_DAYS="30"
            REQUEST_ID="0"
          fi

          python totvs_protheus_etl.py --chunk-index 0 --chunk-size 1000 --lookback-days "$LOOKBACK_DAYS" --request-id "$REQUEST_ID"
