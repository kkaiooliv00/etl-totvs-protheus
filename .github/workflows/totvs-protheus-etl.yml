name: ETL TOTVS Protheus

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This runs every 4 hours.
    - cron: "7 */4 * * *"

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build job chunks
        id: matrix
        run: echo "matrix=$(python totvs_protheus_etl.py --print-chunk-matrix --chunk-size 5)" >> "$GITHUB_OUTPUT"

  run-etl:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETL
        env:
          API_PROTHEUS_PASSWORD: ${{ secrets.API_PROTHEUS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python totvs_protheus_etl.py --chunk-index ${{ matrix.chunk_index }} --chunk-size 5
