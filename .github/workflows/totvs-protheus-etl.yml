name: ETL TOTVS Protheus

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: >
          Dias de historico a sincronizar. Use 0 para carga total sem filtro de data.
        required: true
        type: string
        default: "7"
      request_id:
        description: >
          request_id de uma tabela especifica. Use 0 para rodar todas.
        required: true
        type: string
        default: "0"
  schedule:
    # Segunda a sexta, 23h00 Fortaleza/Recife (02h00 UTC).
    - cron: "0 2 * * 1-5"
    # Domingo, 23h00 Fortaleza/Recife (02h00 UTC).
    - cron: "0 2 * * 0"
permissions:
  contents: read

concurrency:
  group: etl-totvs-protheus
  cancel-in-progress: false

jobs:
  run-etl:
    name: ETL TOTVS Protheus
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python com cache de dependencias
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Resolver lookback_days
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "lookback_days=${{ inputs.lookback_days }}" >> "$GITHUB_OUTPUT"
          else
            echo "lookback_days=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar ETL
        env:
          API_PROTHEUS_USER: ${{ secrets.API_PROTHEUS_USER }}
          API_PROTHEUS_PASSWORD: ${{ secrets.API_PROTHEUS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.request_id }}" ] && [ "${{ inputs.request_id }}" != "0" ]; then
            python totvs_protheus_etl.py \
              --lookback-days "${{ steps.params.outputs.lookback_days }}" \
              --request-id "${{ inputs.request_id }}"
          else
            python totvs_protheus_etl.py \
              --lookback-days "${{ steps.params.outputs.lookback_days }}"
          fi
