name: ETL TOTVS Protheus

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This runs every 4 hours.
    - cron: "0 */4 * * *"

permissions:
  contents: read

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETL
        env:
          API_PROTHEUS_PASSWORD: ${{ secrets.API_PROTHEUS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python totvs_protheus_etl.py
