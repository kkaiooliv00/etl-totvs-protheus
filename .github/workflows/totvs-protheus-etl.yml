name: ETL TOTVS Protheus

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Dias para atualizar os jobs com filtro de data. Use 0 para carga total.
        required: true
        default: "0"
      request_id:
        description: ID da API para executar apenas uma tabela. Deixe vazio para rodar todas.
        required: false
  schedule:
    # GitHub cron uses UTC. Runs at 13:00 America/Fortaleza with 30 days of history.
    - cron: "0 16 * * *"
    # Runs daily at 02:00 America/Fortaleza with 60 days of history.
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: etl-totvs-protheus
  cancel-in-progress: true

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run ETL
        env:
          API_PROTHEUS_PASSWORD: ${{ secrets.API_PROTHEUS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || github.event.schedule == '0 5 * * *' && '60' || '30' }}
        run: |
          COMMAND=(python totvs_protheus_etl.py --chunk-index 0 --chunk-size 1000 --lookback-days "$LOOKBACK_DAYS")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.request_id }}" ]; then
            COMMAND+=(--request-id "${{ inputs.request_id }}")
          fi
          "${COMMAND[@]}"
